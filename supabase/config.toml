project_id = "anecto"

# Appelée depuis l'app avec le JWT de l'utilisateur connecté.
[functions.city-search]
verify_jwt = true

# Appelées par un cron ou un script d'admin, pas par l'app.
# L'authentification se fait par l'en-tête x-anecto-admin-secret.
[functions.generate-anecdote]
verify_jwt = false

[functions.notify-feedback]
verify_jwt = false

[functions.notify-city-ready]
verify_jwt = false

# Appelée avant toute session : c'est elle qui en ouvre une pour le compte de
# revue des magasins. Elle porte sa propre authentification — adresse et code
# comparés à ses secrets — d'où verify_jwt à false.
[functions.review-login]
verify_jwt = false
